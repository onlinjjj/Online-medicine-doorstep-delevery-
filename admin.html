
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medicine Delivery - Admin Panel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f8;
}

.header{
    background:#0d6efd;
    color:white;
    padding:18px;
    text-align:center;
}

.container{
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}

.card h2{
    color:#0d6efd;
    margin-bottom:8px;
}

.orders{
    margin-top:25px;
    background:white;
    padding:20px;
    border-radius:12px;
}

.orders h2{
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
}

th{
    background:#f1f3f5;
}

@media(max-width:600px){
    .orders{
        overflow-x:auto;
    }

    table{
        min-width:700px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>💊 Medicine Delivery Admin</h1>
    <p>Admin Dashboard</p>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <h2 id="totalOrders">0</h2>
            <p>Total Orders</p>
        </div>

        <div class="card">
            <h2 id="pendingOrders">0</h2>
            <p>Pending Orders</p>
        </div>

        <div class="card">
            <h2 id="confirmedOrders">0</h2>
            <p>Confirmed Orders</p>
        </div>

        <div class="card">
            <h2 id="deliveredOrders">0</h2>
            <p>Delivered Orders</p>
        </div>

    </div>

    <div class="orders">

        <h2>📦 Recent Orders</h2>

        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Medicine</th>
                    <th>Phone</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="ordersTable">
                <tr>
                    <td colspan="5" style="text-align:center;">
                        No orders yet
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
