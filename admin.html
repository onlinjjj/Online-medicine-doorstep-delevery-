<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Medicine Doorstep Delivery - Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{background:#f3f6f9;color:#222}

header{
background:#087f5b;
color:white;
padding:20px;
text-align:center;
box-shadow:0 2px 8px #aaa;
}

header h1{font-size:22px}
header p{margin-top:5px}

#loginBox{
width:92%;
max-width:420px;
margin:50px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #ccc;
}

#loginBox h2{
text-align:center;
color:#087f5b;
margin-bottom:20px;
}

input{
width:100%;
padding:13px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
border:0;
border-radius:8px;
padding:12px 16px;
cursor:pointer;
font-size:14px;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#loginBtn{
width:100%;
background:#087f5b;
color:white;
margin-top:10px;
}

#logoutBtn{
background:#dc3545;
color:white;
float:right;
}

#message{
text-align:center;
margin-top:15px;
color:#dc3545;
}

#adminPanel{display:none}

.container{
width:94%;
max-width:1200px;
margin:25px auto;
}

.topbar{
background:white;
padding:18px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 3px 12px #ddd;
overflow:hidden;
}

.topbar h2{
color:#087f5b;
margin-bottom:7px;
}

.email{
color:#666;
font-size:14px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 12px #ddd;
text-align:center;
}

.card h3{
font-size:30px;
color:#087f5b;
margin-bottom:6px;
}

.card p{color:#666}

.ordersBox{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 3px 12px #ddd;
}

.ordersBox h2{
color:#087f5b;
margin-bottom:15px;
}

.refresh{
background:#087f5b;
color:white;
margin-bottom:15px;
}

.order{
border:1px solid #ddd;
border-radius:12px;
padding:16px;
margin-bottom:15px;
background:#fafafa;
}

.order p{
margin:7px 0;
line-height:1.4;
word-break:break-word;
}

.order strong{color:#087f5b}

.status{
display:inline-block;
padding:7px 12px;
border-radius:20px;
margin-top:8px;
font-size:13px;
font-weight:bold;
}

.status.pending{
background:#fff3cd;
color:#856404;
}

.status.confirmed{
background:#d1e7dd;
color:#0f5132;
}

.status.out{
background:#cfe2ff;
color:#084298;
}

.status.delivered{
background:#e2d9f3;
color:#432874;
}

/* ================= AMOUNT ================= */

.amount-box{
margin-top:18px;
padding:18px;
background:#eefaf5;
border:1px solid #b7dfcf;
border-radius:12px;
}

.amount-box h3{
color:#087f5b;
margin-bottom:12px;
}

.amount-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.amount-field label{
display:block;
font-weight:bold;
font-size:13px;
color:#555;
margin-bottom:5px;
}

.amount-input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
margin:0;
}

.save-amount-btn{
width:100%;
margin-top:12px;
background:#087f5b;
color:white;
font-weight:bold;
}

.amount-summary{
margin-top:15px;
background:white;
padding:15px;
border-radius:10px;
border:1px solid #ddd;
}

.amount-summary p{
margin:8px 0;
}

.final-amount{
font-size:22px;
font-weight:bold;
color:#087f5b;
}

.discount-text{
color:#d35400;
font-weight:bold;
}

.order-actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:15px;
}

.order-actions button{
color:white;
font-weight:bold;
}

.confirm-btn{background:#198754}
.delivery-btn{background:#0d6efd}
.delivered-btn{background:#6f42c1}
.delete-btn{background:#dc3545}

.order-date{
color:#777;
font-size:13px;
}

.empty{
text-align:center;
padding:30px;
color:#777;
}

.error{color:#dc3545}

@media(max-width:600px){

header h1{font-size:18px}

.cards{
grid-template-columns:1fr 1fr;
}

.card{
padding:16px 8px;
}

.card h3{
font-size:26px;
}

.amount-row{
grid-template-columns:1fr;
}

.order-actions button{
flex:1 1 45%;
}

}
</style>
</head>

<body>

<header>
<h1>💊 Online Medicine Doorstep Delivery</h1>
<p>Admin Panel</p>
</header>

<!-- LOGIN -->

<div id="loginBox">

<h2>🔐 Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email"
autocomplete="email">

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password">

<button id="loginBtn">Login</button>

<div id="message"></div>

</div>

<!-- ADMIN -->

<div id="adminPanel">

<div class="container">

<div class="topbar">

<button id="logoutBtn">Logout</button>

<h2>📊 Admin Dashboard</h2>

<div class="email">
Logged in as:
<span id="adminEmail"></span>
</div>

</div>

<!-- STATISTICS -->

<div class="cards">

<div class="card">
<h3 id="totalOrders">0</h3>
<p>Total Orders</p>
</div>

<div class="card">
<h3 id="pendingOrders">0</h3>
<p>Pending</p>
</div>

<div class="card">
<h3 id="confirmedOrders">0</h3>
<p>Confirmed</p>
</div>

<div class="card">
<h3 id="outDeliveryOrders">0</h3>
<p>Out for Delivery</p>
</div>

<div class="card">
<h3 id="deliveredOrders">0</h3>
<p>Delivered</p>
</div>

</div>

<!-- ORDERS -->

<div class="ordersBox">

<h2>📦 Customer Orders</h2>

<button class="refresh" id="refreshBtn">
🔄 Refresh Orders
</button>

<div id="orders">
<div class="empty">Loading orders...</div>
</div>

</div>

</div>
</div>

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
query,
orderBy,
doc,
deleteDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ================================
FIREBASE CONFIG
================================ */

const firebaseConfig={

apiKey:
"AIzaSyABmq9B4NEvgtsrJIEfUhjZOqMCjGGHfpI",

authDomain:
"medicine-doorstep-delivery.firebaseapp.com",

projectId:
"medicine-doorstep-delivery",

storageBucket:
"medicine-doorstep-delivery.firebasestorage.app",

messagingSenderId:
"703468135334",

appId:
"1:703468135334:web:56254d5608fe0cd371a567",

measurementId:
"G-14XLF1S53T"

};


/* ================================
ADMIN EMAIL
================================ */

const ADMIN_EMAIL=
"abhijit123kar12@gmail.com";


/* ================================
FIREBASE START
================================ */

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


/* ================================
ELEMENTS
================================ */

const loginBox=
document.getElementById("loginBox");

const adminPanel=
document.getElementById("adminPanel");

const emailInput=
document.getElementById("email");

const passwordInput=
document.getElementById("password");

const loginBtn=
document.getElementById("loginBtn");

const logoutBtn=
document.getElementById("logoutBtn");

const message=
document.getElementById("message");

const adminEmail=
document.getElementById("adminEmail");

const ordersDiv=
document.getElementById("orders");

const refreshBtn=
document.getElementById("refreshBtn");


/* ================================
ESCAPE HTML
================================ */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ================================
LOGIN
================================ */

loginBtn.addEventListener(
"click",
async()=>{

const email=
emailInput.value.trim();

const password=
passwordInput.value;

message.textContent="";

if(!email || !password){

message.textContent=
"Please enter email and password.";

return;

}

if(
email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

message.textContent=
"❌ This email is not authorized.";

return;

}

loginBtn.disabled=true;
loginBtn.textContent="Logging in...";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

console.error(error);

message.textContent=
"❌ Login failed: "+error.message;

loginBtn.disabled=false;
loginBtn.textContent="Login";

}

});


/* ================================
AUTH
================================ */

onAuthStateChanged(
auth,
async user=>{

if(user){

if(
!user.email ||
user.email.toLowerCase() !==
ADMIN_EMAIL.toLowerCase()
){

await signOut(auth);

message.textContent=
"❌ You are not authorized.";

return;

}

loginBox.style.display="none";
adminPanel.style.display="block";

adminEmail.textContent=user.email;

await loadOrders();

}else{

loginBox.style.display="block";
adminPanel.style.display="none";

}

});


/* ================================
LOGOUT
================================ */

logoutBtn.addEventListener(
"click",
async()=>{

await signOut(auth);

location.reload();

});


/* ================================
LOAD ORDERS
================================ */

async function loadOrders(){

ordersDiv.innerHTML=
'<div class="empty">Loading orders...</div>';

try{

const ordersRef=
collection(db,"orders");

let snapshot;

try{

const q=
query(
ordersRef,
orderBy("createdAt","desc")
);

snapshot=
await getDocs(q);

}catch(error){

snapshot=
await getDocs(ordersRef);

}

let total=0;
let pending=0;
let confirmed=0;
let outDelivery=0;
let delivered=0;

ordersDiv.innerHTML="";

if(snapshot.empty){

ordersDiv.innerHTML=
'<div class="empty">📦 No orders received yet.</div>';

updateStats(0,0,0,0,0);

return;

}


/* ================================
EACH ORDER
================================ */

snapshot.forEach(orderDoc=>{

const order=orderDoc.data();

const orderId=orderDoc.id;

total++;


/* STATUS */

const status=
order.status || "Order Received";

const statusLower=
String(status).toLowerCase();

if(
statusLower==="pending" ||
statusLower==="order received"
){

pending++;

}else if(statusLower==="confirmed"){

confirmed++;

}else if(statusLower==="out for delivery"){

outDelivery++;

}else if(statusLower==="delivered"){

delivered++;

}


/* AMOUNTS */

const totalAmount=
Number(order.totalAmount ?? 0);

const discountPercent=
Number(order.discountPercent ?? 0);

const discountAmount=
Number(
order.discountAmount ??
(
totalAmount *
discountPercent / 100
)
);

const finalAmount=
Number(
order.finalAmount ??
(
totalAmount-discountAmount
)
);


/* DATE */

let dateText="";

if(order.createdAt){

try{

if(
typeof order.createdAt.toDate==="function"
){

dateText=
order.createdAt.toDate()
.toLocaleString();

}else{

dateText=
new Date(order.createdAt)
.toLocaleString();

}

}catch(error){

dateText="";

}

}


/* STATUS CLASS */

let statusClass="pending";

if(statusLower==="confirmed"){
statusClass="confirmed";
}else if(statusLower==="out for delivery"){
statusClass="out";
}else if(statusLower==="delivered"){
statusClass="delivered";
}


/* MEDICINE */

let medicine=
order.medicine || "Not provided";

if(typeof medicine==="object"){

try{
medicine=JSON.stringify(medicine);
}catch{
medicine="Not provided";
}

}


/* ORDER CARD */

const orderDiv=
document.createElement("div");

orderDiv.className="order";

orderDiv.innerHTML=`

<p>
<strong>📦 Order ID:</strong>
${escapeHTML(orderId)}
</p>

<p>
<strong>👤 Customer:</strong>
${escapeHTML(order.name || "Not provided")}
</p>

<p>
<strong>📱 Phone:</strong>
${escapeHTML(
order.mobile ||
order.phone ||
"Not provided"
)}
</p>

<p>
<strong>🏠 Address:</strong>
${escapeHTML(order.address || "Not provided")}
</p>

<p>
<strong>💊 Medicine:</strong>
${escapeHTML(String(medicine))}
</p>

<p>
<strong>🔢 Quantity:</strong>
${escapeHTML(order.quantity ?? "1")}
</p>

<p>
<strong>🚚 Delivery:</strong>
${escapeHTML(
order.deliveryArea || "Not provided"
)}
</p>


<div class="amount-summary">

<p>
<strong>💰 Total Amount:</strong>
₹${totalAmount.toFixed(2)}
</p>

<p>
<strong>🎁 Discount:</strong>
<span class="discount-text">
${discountPercent.toFixed(2)}%
</span>
</p>

<p>
<strong>💸 Discount Amount:</strong>
₹${discountAmount.toFixed(2)}
</p>

<p>
<strong>💵 Customer Payable:</strong>
<span class="final-amount">
₹${finalAmount.toFixed(2)}
</span>
</p>

</div>


${
dateText
?
`
<p class="order-date">
🕒 ${escapeHTML(dateText)}
</p>
`
:""
}


<span class="status ${statusClass}">
${escapeHTML(status)}
</span>


<!-- AMOUNT SETTINGS -->

<div class="amount-box">

<h3>💰 Set Customer Amount</h3>

<div class="amount-row">

<div class="amount-field">

<label>Total Amount ₹</label>

<input
type="number"
class="amount-input total-input"
data-id="${escapeHTML(orderId)}"
value="${totalAmount}"
min="0"
step="0.01"
placeholder="Example: 1000">

</div>


<div class="amount-field">

<label>Discount %</label>

<input
type="number"
class="amount-input discount-input"
data-id="${escapeHTML(orderId)}"
value="${discountPercent}"
min="0"
max="100"
step="0.01"
placeholder="Example: 10">

</div>

</div>


<div class="amount-summary">

<p>
Total:
₹<span class="preview-total">
${totalAmount.toFixed(2)}
</span>
</p>

<p>
Discount:
<span class="preview-discount-percent">
${discountPercent.toFixed(2)}
</span>%
</p>

<p>
Discount Amount:
₹<span class="preview-discount">
${discountAmount.toFixed(2)}
</span>
</p>

<p>
Final Payable:
<strong>
₹<span class="preview-final">
${finalAmount.toFixed(2)}
</span>
</strong>
</p>

</div>


<button
class="save-amount-btn"
data-action="saveAmount"
data-id="${escapeHTML(orderId)}">

💾 Save Amount & Discount

</button>

</div>


<div class="order-actions">

<button
class="confirm-btn"
data-action="confirmed"
data-id="${escapeHTML(orderId)}">

✅ Confirm Order

</button>

<button
class="delivery-btn"
data-action="out"
data-id="${escapeHTML(orderId)}">

🚚 Out for Delivery

</button>

<button
class="delivered-btn"
data-action="delivered"
data-id="${escapeHTML(orderId)}">

📦 Delivered

</button>

<button
class="delete-btn"
data-action="delete"
data-id="${escapeHTML(orderId)}">

🗑️ Delete Order

</button>

</div>
`;


ordersDiv.appendChild(orderDiv);


/* LIVE AMOUNT PREVIEW */

const totalInput=
orderDiv.querySelector(".total-input");

const discountInput=
orderDiv.querySelector(".discount-input");

const previewTotal=
orderDiv.querySelector(".preview-total");

const previewDiscountPercent=
orderDiv.querySelector(".preview-discount-percent");

const previewDiscount=
orderDiv.querySelector(".preview-discount");

const previewFinal=
orderDiv.querySelector(".preview-final");


function previewAmount(){

const t=
Number(totalInput.value)||0;

let d=
Number(discountInput.value)||0;

if(d<0)d=0;
if(d>100)d=100;

const discount=
t*d/100;

const final=
t-discount;

previewTotal.textContent=
t.toFixed(2);

previewDiscountPercent.textContent=
d.toFixed(2);

previewDiscount.textContent=
discount.toFixed(2);

previewFinal.textContent=
final.toFixed(2);

}

totalInput.addEventListener(
"input",
previewAmount
);

discountInput.addEventListener(
"input",
previewAmount
);

});


updateStats(
total,
pending,
confirmed,
outDelivery,
delivered
);

}catch(error){

console.error(error);

ordersDiv.innerHTML=`

<div class="empty error">

❌ Unable to load orders.

<br><br>

${escapeHTML(error.message)}

</div>
`;

}

}


/* ================================
BUTTON HANDLER
================================ */

ordersDiv.addEventListener(
"click",
async event=>{

const button=
event.target.closest(
"button[data-action]"
);

if(!button)return;

const orderId=
button.dataset.id;

const action=
button.dataset.action;


if(action==="saveAmount"){

const orderCard=
button.closest(".order");

const totalInput=
orderCard.querySelector(".total-input");

const discountInput=
orderCard.querySelector(".discount-input");

const totalAmount=
Number(totalInput.value);

let discountPercent=
Number(discountInput.value);


if(!Number.isFinite(totalAmount) ||
totalAmount<0){

alert("❌ Enter valid Total Amount.");

return;

}

if(
!Number.isFinite(discountPercent) ||
discountPercent<0 ||
discountPercent>100
){

alert("❌ Discount must be between 0% and 100%.");

return;

}


const discountAmount=
totalAmount*
discountPercent/100;

const finalAmount=
totalAmount-discountAmount;


await saveOrderAmount(
orderId,
totalAmount,
discountPercent,
discountAmount,
finalAmount
);

return;

}


if(action==="delete"){

await deleteOrder(orderId);
return;

}

if(action==="confirmed"){

await updateDeliveryStatus(
orderId,
"Confirmed"
);

return;

}

if(action==="out"){

await updateDeliveryStatus(
orderId,
"Out for Delivery"
);

return;

}

if(action==="delivered"){

await updateDeliveryStatus(
orderId,
"Delivered"
);

return;

}

});


/* ================================
SAVE AMOUNT
================================ */

async function saveOrderAmount(
orderId,
totalAmount,
discountPercent,
discountAmount,
finalAmount
){

try{

await updateDoc(
doc(db,"orders",orderId),
{

totalAmount:totalAmount,

discountPercent:discountPercent,

discountAmount:discountAmount,

finalAmount:finalAmount,

updatedAt:new Date().toISOString()

}
);

alert(
"✅ Amount Saved!\n\n"+
"Total: ₹"+totalAmount.toFixed(2)+
"\nDiscount: "+discountPercent.toFixed(2)+"%"+
"\nDiscount Amount: ₹"+discountAmount.toFixed(2)+
"\nFinal Payable: ₹"+finalAmount.toFixed(2)
);

await loadOrders();

}catch(error){

console.error(error);

alert(
"❌ Amount Save হয়নি:\n"+
error.message
);

}

}


/* ================================
DELETE
================================ */

async function deleteOrder(orderId){

if(!confirm(
"⚠️ এই Order টি permanently Delete করতে চান?"
))return;

try{

await deleteDoc(
doc(db,"orders",orderId)
);

alert("✅ Order Deleted Successfully");

await loadOrders();

}catch(error){

alert(
"❌ Order Delete হয়নি:\n"+
error.message
);

}

}


/* ================================
STATUS
================================ */

async function updateDeliveryStatus(
orderId,
status
){

try{

await updateDoc(
doc(db,"orders",orderId),
{

status:status,

updatedAt:
new Date().toISOString()

}
);

alert(
"✅ Status Updated: "+status
);

await loadOrders();

}catch(error){

alert(
"❌ Status Update হয়নি:\n"+
error.message
);

}

}


/* ================================
STATS
================================ */

function updateStats(
total,
pending,
confirmed,
outDelivery,
delivered
){

document.getElementById(
"totalOrders"
).textContent=total;

document.getElementById(
"pendingOrders"
).textContent=pending;

document.getElementById(
"confirmedOrders"
).textContent=confirmed;

document.getElementById(
"outDeliveryOrders"
).textContent=outDelivery;

document.getElementById(
"deliveredOrders"
).textContent=delivered;

}


/* ================================
REFRESH
================================ */

refreshBtn.addEventListener(
"click",
loadOrders
);

</script>

</body>
</html>
