<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Medicine Doorstep Delivery - Admin</title>


<style>

/* =========================
   RESET
========================= */

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}


body{
background:#f3f7f5;
color:#17372e;
min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{
background:#087c59;
color:white;
padding:20px 15px;
text-align:center;
box-shadow:0 3px 15px #0002;
}


header h1{
font-size:24px;
}


header p{
margin-top:6px;
font-size:14px;
opacity:.9;
}


/* =========================
   LOGIN BOX
========================= */

#loginBox{

width:92%;
max-width:420px;

margin:50px auto;

background:white;

padding:30px 25px;

border-radius:20px;

box-shadow:
0 8px 30px #00000015;

}


#loginBox h2{

text-align:center;

color:#087c59;

margin-bottom:22px;

font-size:24px;

}


/* =========================
   INPUT
========================= */

input{

width:100%;

padding:14px;

margin:8px 0;

border:

1px solid #d5e1dd;

border-radius:10px;

font-size:16px;

outline:none;

background:white;

}


input:focus{

border-color:#087c59;

box-shadow:
0 0 0 3px #087c5915;

}


/* =========================
   BUTTON
========================= */

button{

border:none;

border-radius:10px;

padding:13px 17px;

cursor:pointer;

font-size:14px;

font-weight:bold;

}


button:disabled{

opacity:.6;

cursor:not-allowed;

}


/* LOGIN BUTTON */

#loginBtn{

width:100%;

background:#087c59;

color:white;

margin-top:12px;

font-size:16px;

}


#loginBtn:hover{

background:#066b4d;

}


/* LOGIN MESSAGE */

#message{

text-align:center;

margin-top:15px;

color:#dc3545;

font-size:14px;

line-height:1.5;

}


/* =========================
   ADMIN PANEL
========================= */

#adminPanel{

display:none;

}


/* =========================
   MAIN CONTAINER
========================= */

.container{

width:94%;

max-width:1200px;

margin:25px auto;

}


/* =========================
   TOP BAR
========================= */

.topbar{

background:white;

padding:20px;

border-radius:15px;

margin-bottom:20px;

box-shadow:
0 5px 20px #00000010;

overflow:hidden;

}


.topbar h2{

color:#087c59;

font-size:22px;

margin-bottom:7px;

}


.email{

color:#66756f;

font-size:14px;

}


/* LOGOUT */

#logoutBtn{

background:#dc3545;

color:white;

float:right;

padding:10px 15px;

}


#logoutBtn:hover{

background:#bb2d3b;

}


/* =========================
   STATISTICS
========================= */

.cards{

display:grid;

grid-template-columns:
repeat(5,1fr);

gap:15px;

margin-bottom:20px;

}


.card{

background:white;

padding:20px 12px;

border-radius:15px;

box-shadow:
0 5px 18px #00000010;

text-align:center;

}


.card h3{

font-size:30px;

color:#087c59;

margin-bottom:7px;

}


.card p{

color:#66756f;

font-size:14px;

}


/* =========================
   ORDERS BOX
========================= */

.ordersBox{

background:white;

padding:20px;

border-radius:15px;

box-shadow:
0 5px 20px #00000010;

}


.ordersBox h2{

color:#087c59;

margin-bottom:15px;

font-size:21px;

}


/* =========================
   REFRESH BUTTON
========================= */

.refresh{

background:#087c59;

color:white;

margin-bottom:18px;

}


.refresh:hover{

background:#066b4d;

}


/* =========================
   ORDER CARD
========================= */

.order{

border:

1px solid #dce6e2;

border-radius:15px;

padding:18px;

margin-bottom:18px;

background:#fbfdfc;

}


.order p{

margin:8px 0;

line-height:1.5;

word-break:break-word;

}


.order strong{

color:#087c59;

}


/* =========================
   STATUS
========================= */

.status{

display:inline-block;

padding:8px 14px;

border-radius:25px;

margin-top:10px;

font-size:13px;

font-weight:bold;

}


.status.pending{

background:#fff3cd;

color:#856404;

}


.status.confirmed{

background:#d1e7dd;

color:#0f5132;

}


.status.out{

background:#cfe2ff;

color:#084298;

}


.status.delivered{

background:#e2d9f3;

color:#432874;

}


/* =========================
   AMOUNT SECTION
========================= */

.amount-box{

margin-top:18px;

padding:18px;

background:#eefaf5;

border:

1px solid #b7dfcf;

border-radius:14px;

}


.amount-box h3{

color:#087c59;

margin-bottom:14px;

font-size:18px;

}


.amount-row{

display:grid;

grid-template-columns:
1fr 1fr;

gap:12px;

}


.amount-field label{

display:block;

font-weight:bold;

font-size:13px;

color:#555;

margin-bottom:6px;

}


.amount-input{

width:100%;

padding:12px;

border:

1px solid #ccd9d5;

border-radius:9px;

font-size:16px;

margin:0;

}


/* =========================
   SAVE AMOUNT
========================= */

.save-amount-btn{

width:100%;

margin-top:13px;

background:#087c59;

color:white;

font-weight:bold;

}


.save-amount-btn:hover{

background:#066b4d;

}


/* =========================
   AMOUNT SUMMARY
========================= */

.amount-summary{

margin-top:15px;

background:white;

padding:15px;

border:

1px solid #dce6e2;

border-radius:10px;

}


.amount-summary p{

margin:8px 0;

}


.final-amount{

font-size:22px;

font-weight:bold;

color:#087c59;

}


.discount-text{

color:#d35400;

font-weight:bold;

}


/* =========================
   ORDER ACTIONS
========================= */

.order-actions{

display:flex;

flex-wrap:wrap;

gap:9px;

margin-top:16px;

}


.order-actions button{

color:white;

font-weight:bold;

}


.confirm-btn{

background:#198754;

}


.delivery-btn{

background:#0d6efd;

}


.delivered-btn{

background:#6f42c1;

}


.delete-btn{

background:#dc3545;

}


/* =========================
   DATE
========================= */

.order-date{

color:#777;

font-size:13px;

margin-top:10px;

}


/* =========================
   EMPTY
========================= */

.empty{

text-align:center;

padding:35px 15px;

color:#777;

}


.error{

color:#dc3545;

}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

.cards{

grid-template-columns:
repeat(3,1fr);

}

}


@media(max-width:600px){

header h1{

font-size:19px;

}


.container{

width:94%;

margin:18px auto;

}


.topbar{

padding:17px;

}


.topbar h2{

font-size:19px;

}


.cards{

grid-template-columns:
1fr 1fr;

gap:10px;

}


.card{

padding:16px 8px;

}


.card h3{

font-size:26px;

}


.card p{

font-size:12px;

}


.ordersBox{

padding:15px;

}


.order{

padding:15px;

}


.amount-row{

grid-template-columns:
1fr;

}


.order-actions button{

flex:
1 1 45%;

}


#logoutBtn{

padding:9px 12px;

font-size:12px;

}

}


@media(max-width:380px){

.cards{

grid-template-columns:1fr;

}


.order-actions button{

flex:1 1 100%;

}

}

</style>

</head>

   <script type="module">

/* =========================================
   FIREBASE IMPORT
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  doc,
  deleteDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyABmq9B4NEvgtsrJIEfUhjZOqMCjGGHfpI",

  authDomain:
  "medicine-doorstep-delivery.firebaseapp.com",

  projectId:
  "medicine-doorstep-delivery",

  storageBucket:
  "medicine-doorstep-delivery.firebasestorage.app",

  messagingSenderId:
  "703468135334",

  appId:
  "1:703468135334:web:56254d5608fe0cd371a567",

  measurementId:
  "G-14XLF1S53T"
};


/* =========================================
   ADMIN EMAIL
========================================= */

const ADMIN_EMAIL =
"abhijit123kar12@gmail.com";


/* =========================================
   START FIREBASE
========================================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================================
   HTML ELEMENTS
========================================= */

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const message =
document.getElementById("message");

const adminEmail =
document.getElementById("adminEmail");

const ordersDiv =
document.getElementById("orders");

const refreshBtn =
document.getElementById("refreshBtn");


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================
   ADMIN LOGIN
========================================= */

loginBtn.addEventListener(
"click",
async function(){

  const email =
  emailInput.value.trim();

  const password =
  passwordInput.value;

  message.textContent = "";

  if(!email || !password){

    message.textContent =
    "Please enter email and password.";

    return;
  }


  if(
    email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    message.textContent =
    "❌ This email is not authorized.";

    return;
  }


  loginBtn.disabled = true;

  loginBtn.textContent =
  "Logging in...";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }

  catch(error){

    console.error(error);

    message.textContent =
    "❌ Login failed: " +
    error.message;

    loginBtn.disabled = false;

    loginBtn.textContent =
    "Login";
  }

});


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
auth,
async function(user){

  if(user){

    if(
      !user.email ||
      user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      await signOut(auth);

      message.textContent =
      "❌ You are not authorized.";

      return;
    }


    loginBox.style.display =
    "none";

    adminPanel.style.display =
    "block";

    adminEmail.textContent =
    user.email;


    await loadOrders();

  }

  else{

    loginBox.style.display =
    "block";

    adminPanel.style.display =
    "none";

    loginBtn.disabled =
    false;

    loginBtn.textContent =
    "Login";
  }

});


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
"click",
async function(){

  try{

    await signOut(auth);

  }

  catch(error){

    console.error(error);

  }

});


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

  ordersDiv.innerHTML =
  '<div class="empty">⏳ Loading orders...</div>';


  try{

    const ordersRef =
    collection(db,"orders");

    let snapshot;


    /* Try newest first */

    try{

      const q =
      query(
        ordersRef,
        orderBy("createdAt","desc")
      );

      snapshot =
      await getDocs(q);

    }

    catch(error){

      console.log(
        "createdAt sorting unavailable, loading normally."
      );

      snapshot =
      await getDocs(ordersRef);
    }


    let total = 0;

    let pending = 0;

    let confirmed = 0;

    let outDelivery = 0;

    let delivered = 0;


    ordersDiv.innerHTML = "";


    /* =====================================
       NO ORDERS
    ===================================== */

    if(snapshot.empty){

      ordersDiv.innerHTML = `
        <div class="empty">
          📦 No orders received yet.
        </div>
      `;

      updateStats(
        0,
        0,
        0,
        0,
        0
      );

      return;
    }


    /* =====================================
       EACH ORDER
    ===================================== */

    snapshot.forEach(
    function(orderDoc){

      const order =
      orderDoc.data();

      const orderId =
      orderDoc.id;


      total++;


      /* =================================
         STATUS
      ================================= */

      const status =
      order.status ||
      "Order Received";


      const statusLower =
      String(status)
      .toLowerCase();


      if(
        statusLower === "pending" ||
        statusLower === "order received"
      ){

        pending++;

      }

      else if(
        statusLower === "confirmed"
      ){

        confirmed++;

      }

      else if(
        statusLower === "out for delivery"
      ){

        outDelivery++;

      }

      else if(
        statusLower === "delivered"
      ){

        delivered++;
      }


      /* =================================
         TOTAL AMOUNT
      ================================= */

      const totalAmount =
      Number(
        order.totalAmount ?? 0
      );


      /* =================================
         DISCOUNT %
      ================================= */

      const discountPercent =
      Number(
        order.discountPercent ?? 0
      );


      /* =================================
         DISCOUNT AMOUNT
      ================================= */

      const discountAmount =
      Number(
        order.discountAmount ??
        (
          totalAmount *
          discountPercent /
          100
        )
      );


      /* =================================
         FINAL PAYABLE
      ================================= */

      const finalAmount =
      Number(
        order.finalAmount ??
        (
          totalAmount -
          discountAmount
        )
      );


      /* =================================
         DATE
      ================================= */

      let dateText = "";


      if(order.createdAt){

        try{

          if(
            typeof order.createdAt.toDate ===
            "function"
          ){

            dateText =
            order.createdAt
            .toDate()
            .toLocaleString();

          }

          else{

            dateText =
            new Date(
              order.createdAt
            ).toLocaleString();
          }

        }

        catch(error){

          dateText = "";
        }
      }


      /* =================================
         STATUS CLASS
      ================================= */

      let statusClass =
      "pending";


      if(
        statusLower === "confirmed"
      ){

        statusClass =
        "confirmed";

      }

      else if(
        statusLower === "out for delivery"
      ){

        statusClass =
        "out";

      }

      else if(
        statusLower === "delivered"
      ){

        statusClass =
        "delivered";
      }


      /* =================================
         MEDICINE
      ================================= */

      let medicine =
      order.medicine ||
      "Not provided";


      if(
        typeof medicine ===
        "object"
      ){

        try{

          medicine =
          JSON.stringify(
            medicine
          );

        }

        catch(error){

          medicine =
          "Not provided";
        }
      }


      /* =================================
         DELIVERY
      ================================= */

      const delivery =
      order.deliveryArea ||
      order.delivery ||
      "Not provided";


      /* =================================
         CUSTOMER PHONE
      ================================= */

      const phone =
      order.mobile ||
      order.phone ||
      "Not provided";


      /* =================================
         CREATE ORDER CARD
      ================================= */

      const orderDiv =
      document.createElement("div");

      orderDiv.className =
      "order";


      orderDiv.innerHTML = `

        <p>
          <strong>📦 Order ID:</strong>
          ${escapeHTML(orderId)}
        </p>


        <p>
          <strong>👤 Customer:</strong>
          ${escapeHTML(
            order.name ||
            "Not provided"
          )}
        </p>


        <p>
          <strong>📱 Phone:</strong>
          ${escapeHTML(phone)}
        </p>


        <p>
          <strong>🏠 Address:</strong>
          ${escapeHTML(
            order.address ||
            "Not provided"
          )}
        </p>


        <p>
          <strong>💊 Medicine:</strong>
          ${escapeHTML(
            String(medicine)
          )}
        </p>


        <p>
          <strong>🔢 Quantity:</strong>
          ${escapeHTML(
            order.quantity ??
            "1"
          )}
        </p>


        <p>
          <strong>🚚 Delivery:</strong>
          ${escapeHTML(delivery)}
        </p>


        <!-- CUSTOMER AMOUNT -->

        <div class="amount-summary">

          <p>
            <strong>
              💰 Original Amount:
            </strong>

            ₹${totalAmount.toFixed(2)}
          </p>


          <p>
            <strong>
              🎁 Discount:
            </strong>

            <span class="discount-text">

              ${discountPercent.toFixed(2)}%

            </span>
          </p>


          <p>
            <strong>
              💸 Discount Amount:
            </strong>

            ₹${discountAmount.toFixed(2)}
          </p>


          <p>
            <strong>
              💵 Customer Payable:
            </strong>

            <span class="final-amount">

              ₹${finalAmount.toFixed(2)}

            </span>
          </p>

        </div>


        ${
          dateText
          ?
          `
          <p class="order-date">

            🕒 ${escapeHTML(dateText)}

          </p>
          `
          :
          ""
        }


        <span
          class="status ${statusClass}"
        >

          ${escapeHTML(status)}

        </span>


        <!-- ===========================
             ADMIN AMOUNT SETTING
        ============================ -->

        <div class="amount-box">

          <h3>
            💰 Set Customer Amount
          </h3>


          <div class="amount-row">


            <div class="amount-field">

              <label>
                Original Amount ₹
              </label>


              <input
                type="number"
                class="amount-input total-input"
                data-id="${escapeHTML(orderId)}"
                value="${totalAmount}"
                min="0"
                step="0.01"
                placeholder="Example: 1000"
              >

            </div>


            <div class="amount-field">

              <label>
                Discount %
              </label>


              <input
                type="number"
                class="amount-input discount-input"
                data-id="${escapeHTML(orderId)}"
                value="${discountPercent}"
                min="0"
                max="100"
                step="0.01"
                placeholder="Example: 10"
              >

            </div>

          </div>


          <!-- LIVE PREVIEW -->

          <div class="amount-summary">

            <p>

              Original Amount:

              ₹<span class="preview-total">

                ${totalAmount.toFixed(2)}

              </span>

            </p>


            <p>

              Discount:

              <span class="preview-discount-percent">

                ${discountPercent.toFixed(2)}

              </span>%

            </p>


            <p>

              Discount Amount:

              ₹<span class="preview-discount">

                ${discountAmount.toFixed(2)}

              </span>

            </p>


            <p>

              <strong>
                Customer Payable:
              </strong>

              ₹<span class="preview-final">

                ${finalAmount.toFixed(2)}

              </span>

            </p>

          </div>


          <button
            class="save-amount-btn"
            data-action="saveAmount"
            data-id="${escapeHTML(orderId)}"
          >

            💾 Save Amount & Discount

          </button>

        </div>


        <!-- BUTTONS -->

        <div class="order-actions">


          <button
            class="confirm-btn"
            data-action="confirmed"
            data-id="${escapeHTML(orderId)}"
          >

            ✅ Confirm Order

          </button>


          <button
            class="delivery-btn"
            data-action="out"
            data-id="${escapeHTML(orderId)}"
          >

            🚚 Out for Delivery

          </button>


          <button
            class="delivered-btn"
            data-action="delivered"
            data-id="${escapeHTML(orderId)}"
          >

            📦 Delivered

          </button>


          <button
            class="delete-btn"
            data-action="delete"
            data-id="${escapeHTML(orderId)}"
          >

            🗑️ Delete Order

          </button>


        </div>

      `;


      ordersDiv.appendChild(
        orderDiv
      );


      /* =================================
         LIVE DISCOUNT CALCULATION
      ================================= */

      const totalInput =
      orderDiv.querySelector(
        ".total-input"
      );


      const discountInput =
      orderDiv.querySelector(
        ".discount-input"
      );


      const previewTotal =
      orderDiv.querySelector(
        ".preview-total"
      );


      const previewDiscountPercent =
      orderDiv.querySelector(
        ".preview-discount-percent"
      );


      const previewDiscount =
      orderDiv.querySelector(
        ".preview-discount"
      );


      const previewFinal =
      orderDiv.querySelector(
        ".preview-final"
      );


      function previewAmount(){

        const t =
        Number(
          totalInput.value
        ) || 0;


        let d =
        Number(
          discountInput.value
        ) || 0;


        if(d < 0){

          d = 0;
        }


        if(d > 100){

          d = 100;
        }


        const discount =
        t * d / 100;


        const final =
        t - discount;


        previewTotal.textContent =
        t.toFixed(2);


        previewDiscountPercent.textContent =
        d.toFixed(2);


        previewDiscount.textContent =
        discount.toFixed(2);


        previewFinal.textContent =
        final.toFixed(2);
      }


      totalInput.addEventListener(
        "input",
        previewAmount
      );


      discountInput.addEventListener(
        "input",
        previewAmount
      );

    });


    /* =================================
       UPDATE DASHBOARD
    ================================= */

    updateStats(
      total,
      pending,
      confirmed,
      outDelivery,
      delivered
    );

  }


  catch(error){

    console.error(error);


    ordersDiv.innerHTML = `

      <div class="empty error">

        ❌ Unable to load orders.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}
      /* =========================================
   ORDER BUTTON HANDLER
========================================= */

ordersDiv.addEventListener(
"click",
async function(event){

  const button =
  event.target.closest(
    "button[data-action]"
  );

  if(!button) return;


  const orderId =
  button.dataset.id;

  const action =
  button.dataset.action;


  /* =====================================
     SAVE AMOUNT + DISCOUNT
  ===================================== */

  if(action === "saveAmount"){

    const orderCard =
    button.closest(".order");

    const totalInput =
    orderCard.querySelector(
      ".total-input"
    );

    const discountInput =
    orderCard.querySelector(
      ".discount-input"
    );


    const totalAmount =
    Number(totalInput.value);


    let discountPercent =
    Number(discountInput.value);


    if(
      !Number.isFinite(totalAmount) ||
      totalAmount < 0
    ){

      alert(
        "❌ Please enter a valid amount."
      );

      return;
    }


    if(
      !Number.isFinite(discountPercent) ||
      discountPercent < 0 ||
      discountPercent > 100
    ){

      alert(
        "❌ Discount must be between 0% and 100%."
      );

      return;
    }


    const discountAmount =
    totalAmount *
    discountPercent /
    100;


    const finalAmount =
    totalAmount -
    discountAmount;


    button.disabled = true;

    button.textContent =
    "Saving...";


    await saveOrderAmount(
      orderId,
      totalAmount,
      discountPercent,
      discountAmount,
      finalAmount
    );


    button.disabled = false;

    button.textContent =
    "💾 Save Amount & Discount";


    return;
  }


  /* =====================================
     DELETE ORDER
  ===================================== */

  if(action === "delete"){

    await deleteOrder(
      orderId
    );

    return;
  }


  /* =====================================
     CONFIRM ORDER
  ===================================== */

  if(action === "confirmed"){

    await updateDeliveryStatus(
      orderId,
      "Confirmed"
    );

    return;
  }


  /* =====================================
     OUT FOR DELIVERY
  ===================================== */

  if(action === "out"){

    await updateDeliveryStatus(
      orderId,
      "Out for Delivery"
    );

    return;
  }


  /* =====================================
     DELIVERED
  ===================================== */

  if(action === "delivered"){

    await updateDeliveryStatus(
      orderId,
      "Delivered"
    );

    return;
  }

});


/* =========================================
   SAVE AMOUNT FUNCTION
========================================= */

async function saveOrderAmount(
  orderId,
  totalAmount,
  discountPercent,
  discountAmount,
  finalAmount
){

  try{

    await updateDoc(
      doc(
        db,
        "orders",
        orderId
      ),
      {

        totalAmount:
        totalAmount,

        discountPercent:
        discountPercent,

        discountAmount:
        discountAmount,

        finalAmount:
        finalAmount,

        updatedAt:
        new Date().toISOString()

      }
    );


    alert(
      "✅ Amount Saved Successfully!\n\n" +

      "Original Amount: ₹" +
      totalAmount.toFixed(2) +

      "\nDiscount: " +
      discountPercent.toFixed(2) +
      "%" +

      "\nDiscount Amount: ₹" +
      discountAmount.toFixed(2) +

      "\nCustomer Payable: ₹" +
      finalAmount.toFixed(2)
    );


    await loadOrders();

  }

  catch(error){

    console.error(error);


    alert(
      "❌ Amount save হয়নি.\n\n" +
      error.message
    );

  }

}


/* =========================================
   DELETE ORDER FUNCTION
========================================= */

async function deleteOrder(
  orderId
){

  const confirmDelete =
  confirm(
    "⚠️ এই Order টি permanently delete করতে চান?\n\n" +
    "Order ID: " +
    orderId
  );


  if(!confirmDelete){

    return;
  }


  try{

    await deleteDoc(
      doc(
        db,
        "orders",
        orderId
      )
    );


    alert(
      "✅ Order Deleted Successfully."
    );


    await loadOrders();

  }

  catch(error){

    console.error(error);


    alert(
      "❌ Order delete হয়নি.\n\n" +
      error.message
    );

  }

}


/* =========================================
   UPDATE DELIVERY STATUS
========================================= */

async function updateDeliveryStatus(
  orderId,
  status
){

  try{

    await updateDoc(
      doc(

        "orders",
        orderId
      ),
      {

        status:

      }
    );


    alert(
      "✅ Status Updated Successfully!\n\n" +
      "Order ID: " +
      orderId +
      "\nStatus: " +
      status
    );


    await loadOrders();

  }

  catch(error){

    console.error(error);


    alert(
      "❌ Status update হয়নি.\n\n" +
      error.message
    );

  }

}


/* =========================================
   DASHBOARD STATISTICS
========================================= */

function updateStats(
  total,
  pending,
  confirmed,
  outDelivery,
  delivered
){

  const totalElement =
  document.getElementById(
    "totalOrders"
  );

  const pendingElement =
  document.getElementById(
    "pendingOrders"
  );

  const confirmedElement =
  document.getElementById(
    "confirmedOrders"
  );

  const outDeliveryElement =
  document.getElementById(
    "outDeliveryOrders"
  );

  const deliveredElement =
  document.getElementById(
    "deliveredOrders"
  );


  if(totalElement){

    totalElement.textContent =
    total;
  }


  if(pendingElement){

    pendingElement.textContent =
    pending;
  }


  if(confirmedElement){

    confirmedElement.textContent =
    confirmed;
  }


  if(outDeliveryElement){

    outDeliveryElement.textContent =
    outDelivery;
  }


  if(deliveredElement){

    deliveredElement.textContent =
    delivered;
  }

}
