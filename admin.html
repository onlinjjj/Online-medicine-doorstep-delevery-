<script type="module">

/* =========================================
   PART 3 — ADMIN ACTIONS
   Amount + Discount + Status + Delete
========================================= */


/* =========================================
   BUTTON HANDLER
========================================= */

ordersDiv.addEventListener("click", async (event) => {

    const button = event.target.closest(
        "button[data-action]"
    );

    if (!button) return;


    const orderId = button.dataset.id;
    const action = button.dataset.action;


    /* =====================================
       SAVE AMOUNT + DISCOUNT
    ===================================== */

    if (action === "saveAmount") {

        const orderCard =
            button.closest(".order");

        if (!orderCard) return;


        const totalInput =
            orderCard.querySelector(
                ".total-input"
            );

        const discountInput =
            orderCard.querySelector(
                ".discount-input"
            );


        const totalAmount =
            Number(totalInput.value);


        let discountPercent =
            Number(discountInput.value);


        /* VALIDATE TOTAL */

        if (
            !Number.isFinite(totalAmount) ||
            totalAmount < 0
        ) {

            alert(
                "❌ Please enter a valid Total Amount."
            );

            return;
        }


        /* VALIDATE DISCOUNT */

        if (
            !Number.isFinite(discountPercent) ||
            discountPercent < 0 ||
            discountPercent > 100
        ) {

            alert(
                "❌ Discount must be between 0% and 100%."
            );

            return;
        }


        /* CALCULATE */

        const discountAmount =
            totalAmount *
            discountPercent /
            100;


        const finalAmount =
            totalAmount -
            discountAmount;


        /* SAVE */

        await saveOrderAmount(
            orderId,
            totalAmount,
            discountPercent,
            discountAmount,
            finalAmount
        );

        return;
    }


    /* =====================================
       DELETE
    ===================================== */

    if (action === "delete") {

        await deleteOrder(orderId);

        return;
    }


    /* =====================================
       CONFIRMED
    ===================================== */

    if (action === "confirmed") {

        await updateDeliveryStatus(
            orderId,
            "Confirmed"
        );

        return;
    }


    /* =====================================
       OUT FOR DELIVERY
    ===================================== */

    if (action === "out") {

        await updateDeliveryStatus(
            orderId,
            "Out for Delivery"
        );

        return;
    }


    /* =====================================
       DELIVERED
    ===================================== */

    if (action === "delivered") {

        await updateDeliveryStatus(
            orderId,
            "Delivered"
        );

        return;
    }

});


/* =========================================
   SAVE AMOUNT
========================================= */

async function saveOrderAmount(
    orderId,
    totalAmount,
    discountPercent,
    discountAmount,
    finalAmount
) {

    try {

        await updateDoc(
            doc(
                db,
                "orders",
                orderId
            ),
            {

                totalAmount:
                    Number(totalAmount),

                discountPercent:
                    Number(discountPercent),

                discountAmount:
                    Number(discountAmount),

                finalAmount:
                    Number(finalAmount),

                updatedAt:
                    new Date().toISOString()

            }
        );


        alert(
            "✅ Amount Saved Successfully!\n\n" +

            "💰 Total Amount: ₹" +
            totalAmount.toFixed(2) +

            "\n🎁 Discount: " +
            discountPercent.toFixed(2) +
            "%" +

            "\n💸 Discount Amount: ₹" +
            discountAmount.toFixed(2) +

            "\n💵 Customer Payable: ₹" +
            finalAmount.toFixed(2)
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "Amount Save Error:",
            error
        );


        alert(
            "❌ Amount Save হয়নি.\n\n" +
            error.message
        );

    }

}


/* =========================================
   DELETE ORDER
========================================= */

async function deleteOrder(orderId) {

    const confirmDelete =
        confirm(
            "⚠️ এই Order টি permanently Delete করতে চান?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        await deleteDoc(
            doc(
                db,
                "orders",
                orderId
            )
        );


        alert(
            "✅ Order Deleted Successfully"
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "Delete Error:",
            error
        );


        alert(
            "❌ Order Delete হয়নি.\n\n" +
            error.message
        );

    }

}


/* =========================================
   UPDATE ORDER STATUS
========================================= */

async function updateDeliveryStatus(
    orderId,
    status
) {

    try {

        await updateDoc(
            doc(
                db,
                "orders",
                orderId
            ),
            {

                status:
                    status,

                updatedAt:
                    new Date().toISOString()

            }
        );


        alert(
            "✅ Status Updated Successfully!\n\n" +
            "📌 Status: " +
            status
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "Status Update Error:",
            error
        );


        alert(
            "❌ Status Update হয়নি.\n\n" +
            error.message
        );

    }

}


/* =========================================
   DASHBOARD STATISTICS
========================================= */

function updateStats(
    total,
    pending,
    confirmed,
    outDelivery,
    delivered
) {

    document.getElementById(
        "totalOrders"
    ).textContent =
        total;


    document.getElementById(
        "pendingOrders"
    ).textContent =
        pending;


    document.getElementById(
        "confirmedOrders"

        confirmed;


    document.getElementById(
        "outDeliveryOrders"
    ).textContent =
        outDelivery;


    document.getElementById(
        "deliveredOrders"
    ).textContent =
        delivered;

}


/* =========================================

========================================= */

refreshBtn.addEventListener(

        refreshBtn.disabled = true;

        } catch (error) {

        }


        refreshBtn.disabled = false;

        refreshBtn.textContent =
            "🔄 Refresh Orders";

    }
);


/* =========================================
   END PART 3
========================================= */

</script>

/* =========================================

========================================= */

ordersDiv.addEventListener("click", async function(event){

    const button =
        event.target.closest("button[data-action]");

    if(!button) return;


    const orderId =
        button.dataset.id;

    const action =
        button.dataset.action;


    /* =====================================
       SAVE AMOUNT + DISCOUNT
    ===================================== */

    if(action === "saveAmount"){

        const orderCard =
            button.closest(".order");

        if(!orderCard){

            alert("❌ Order card not found.");

            return;
        }


        const totalInput =
            orderCard.querySelector(".total-input");

        const discountInput =
            orderCard.querySelector(".discount-input");


        const totalAmount =
            Number(totalInput.value);


        let discountPercent =
            Number(discountInput.value);


        /* TOTAL VALIDATION */

        if(
            !Number.isFinite(totalAmount) ||
            totalAmount < 0
        ){

            alert(
                "❌ Please enter a valid Total Amount."
            );

            return;
        }


        /* DISCOUNT VALIDATION */

        if(
            !Number.isFinite(discountPercent) ||
            discountPercent < 0 ||
            discountPercent > 100
        ){

            alert(
                "❌ Discount must be between 0% and 100%."
            );

            return;
        }


        /* CALCULATE DISCOUNT */

        const discountAmount =
            totalAmount *
            discountPercent /
            100;


        /* FINAL CUSTOMER AMOUNT */

        const finalAmount =
            totalAmount -
            discountAmount;


        await saveOrderAmount(
            orderId,
            totalAmount,
            discountPercent,
            discountAmount,
            finalAmount
        );

        return;
    }


    /* =====================================
       DELETE ORDER
    ===================================== */

    if(action === "delete"){

        await deleteOrder(orderId);

        return;
    }


    /* =====================================
       CONFIRM ORDER
    ===================================== */

    if(action === "confirmed"){

        await updateDeliveryStatus(
            orderId,
            "Confirmed"
        );

        return;
    }


    /* =====================================
       OUT FOR DELIVERY
    ===================================== */

    if(action === "out"){

        await updateDeliveryStatus(
            orderId,
            "Out for Delivery"
        );

        return;
    }


    /* =====================================
       DELIVERED
    ===================================== */

    if(action === "delivered"){

        await updateDeliveryStatus(
            orderId,
            "Delivered"
        );

        return;
    }

});

        alert(
            "✅ Amount Saved Successfully!\n\n" +

            "💰 Total Amount: ₹" +
            totalAmount.toFixed(2) +

            "\n🎁 Discount: " +
            discountPercent.toFixed(2) +
            "%" +

            "\n💸 Discount Amount: ₹" +
            discountAmount.toFixed(2) +

            "\n💵 Customer Payable: ₹" +
            finalAmount.toFixed(2)
        );


        /* RELOAD ORDERS */

        await loadOrders();


    }catch(error){

        console.error(
            "Amount Save Error:",
            error
        );


        alert(
            "❌ Amount Save হয়নি.\n\n" +
            error.message
        );

    }

}


/* =========================================
   DELETE ORDER
========================================= */

async function deleteOrder(orderId){

    const confirmDelete =
        confirm(
            "⚠️ এই Order টি permanently Delete করতে চান?"
        );


    if(!confirmDelete){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "orders",
                orderId
            )
        );


        alert(
            "✅ Order Deleted Successfully!"
        );


        await loadOrders();


    }catch(error){

        console.error(
            "Delete Error:",
            error
        );


        alert(
            "❌ Order Delete হয়নি.\n\n" +
            error.message
        );

    }

}


/* =========================================

========================================= */

async function updateDeliveryStatus(
    orderId,
    status
){

    try{

        await updateDoc(
            doc(
                db,
                "orders",
                orderId
            ),
            {

                status:
                    status,

                updatedAt:
                    new Date().toISOString()

            }
        );


        alert(
            "✅ Status Updated Successfully!\n\n" +
            "📌 " +
            status
        );


        await loadOrders();


    }catch(error){

        console.error(
            "Status Update Error:",
            error
        );


        alert(
            "❌ Status Update হয়নি.\n\n" +
            error.message
        );

    }

}
